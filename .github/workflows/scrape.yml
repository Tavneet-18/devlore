name: Daily Ingest

# Backup scheduler for the event pipeline. Vercel Cron also runs
# /api/cron/ingest daily; this job is a fallback so ingestion still happens
# if the Vercel deployment is paused, rebuilding, or rate-limited.
on:
  schedule:
    # 20:30 UTC == 02:00 IST
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Restrict to a single city (optional, e.g. Bangalore)"
        required: false
      dry_run:
        description: "Preview discovery without writing to the database"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'mock' }}
          DISCOVERY_MODE: ${{ vars.DISCOVERY_MODE || 'mock' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.city }}" ]; then ARGS="$ARGS --city=${{ inputs.city }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx scripts/daily-scrape.ts $ARGS

      - name: Upload discovery summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary
          path: ingest-summary.json
          if-no-files-found: ignore
          retention-days: 7
